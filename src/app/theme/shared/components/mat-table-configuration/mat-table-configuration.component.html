<app-card [hidHeader]="true" blockClass="table-border-style" class="list-panel">
    <div class="table-responsive">
        <div class="example-table-container">
            <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8 custom-table">
                <ng-container *ngFor="let column of columns" [matColumnDef]="column.name">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ column?.displayName }}</th>
                    <td mat-cell *matCellDef="let row">
                        <ng-container *ngIf="column.type === 'options'; else normalCell">
                            <span class="badge"
                                [ngClass]="column.badgeColors[row[column.name]] ? column.badgeColors[row[column.name]] : 'badge-success'">
                                {{ row[column.name] }}
                            </span>
                        </ng-container>
                        <ng-template #normalCell>
                            <ng-container *ngIf="column.displayFcn; else defaultCell">
                                {{ column.displayFcn(row) }}
                            </ng-container>
                            <ng-template #defaultCell>
                                {{ row[column?.name] }}
                            </ng-template>
                        </ng-template>
                    </td>
                </ng-container>
                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef>Actions</th>
                    <td mat-cell *matCellDef="let row">
                        <ng-container *ngIf="actionKeys.includes('checkbox'); else actionButtons">
                            <mat-radio-group [(ngModel)]="selectedRow">
                                <mat-radio-button [value]="row" (change)="onCheckboxChecked(row.id ? row.id : i, $event)"
                                ></mat-radio-button>
                            </mat-radio-group>
                        </ng-container>

                        <ng-template #actionButtons>
                            <ng-container *ngFor="let action of actionKeys">
                                <button *ngIf="action == 'edit'" mat-button (click)="onEditClicked(row)">
                                    <i class="feather icon-edit"></i>
                                </button>
                                <button *ngIf="action == 'view'" mat-button (click)="onViewClicked(row)">
                                    <i class="feather icon-eye"></i>
                                </button>
                                <button *ngIf="action == 'delete'" mat-button (click)="onDeleteClicked(row)">
                                    <i class="feather icon-trash"></i>
                                </button>
                                <button *ngIf="action == 'download'" mat-button (click)="onDownloadClicked(row)">
                                    <i class="feather icon-download"></i>
                                </button>
                            </ng-container>
                        </ng-template>

                    </td>

                </ng-container>


                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
        </div>
    </div>
    <div class="paginator-container">
        <mat-paginator [length]="totalCount" [pageSize]="pageSize" [pageSizeOptions]="pageSizeOptions"
            (page)="handlePagination($event)">
        </mat-paginator>
    </div>
</app-card>
