<div class="row">
    <div class="col-xl-12">
        <form [formGroup]="tripFormSearchDetails" autocomplete="off">
            <!-- Search Panel -->
            <app-card [hidHeader]="true" class="list-panel add-panel">
                <h4>Search</h4>
                <div class="row">
                    <!-- Driver Name -->
                    <div class="col-lg-3 col-md-3 col-sm-6 col-12">
                        <div class="form-group">
                            <label for="driverName">Driver Name</label>
                            <input type="text" id="driverName" formControlName="driverName" class="form-control"
                                placeholder="Enter Driver Name" />
                        </div>
                    </div>
  
                    <!-- Driver Number -->
                    <div class="col-lg-3 col-md-3 col-sm-6 col-12">
                        <div class="form-group">
                            <label for="driverNumber">Driver Number</label>
                            <input type="text" id="driverNumber" formControlName="driverNumber" class="form-control"
                                placeholder="Enter Driver Number" />
                        </div>
                    </div>
  
                    <!-- Vehicle Number -->
                    <div class="col-lg-3 col-md-3 col-sm-6 col-12">
                        <div class="form-group">
                            <label for="vehicleNumber">Vehicle Number</label>
                            <input type="text" id="vehicleNumber" formControlName="vehiclenumber" class="form-control"
                                placeholder="Enter Vehicle Number" />
                        </div>
                    </div>
                </div>
  
                <!-- Submit and Cancel buttons -->
                <div class="row mt-3">
                    <div class="col-lg-12 text-end">
                        <div class="modal-footer">
                            <button type="submit" class="btn btn-outline-info list-button-container" (click)="search()"><span class="list-text-alaign-center">Submit</span></button>
                            <button type="button" class="btn btn-outline-secondary list-button-container" (click)="onclear()"><span class="list-text-alaign-center">Clerr</span></button>
  
                        </div>
                    </div>
                </div>
            </app-card>
        </form>
    </div>
  </div>
