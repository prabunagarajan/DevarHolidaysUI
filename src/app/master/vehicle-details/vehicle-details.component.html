<div class="row">
  <div class="col-xl-12">
    <form [formGroup]="vehicleFormSearchDetails" autocomplete="off">
      <!-- <h5>Driver Details</h5> -->
      <div class="accordion" id="accordionPanelsStayOpenExample">
        <div class="accordion-item">
          <h2 class="accordion-header" id="panelsStayOpen-headingOne">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
              data-bs-target="#panelsStayOpen-collapseOne" aria-expanded="false"
              aria-controls="panelsStayOpen-collapseOne">
              Search
            </button>
          </h2>

          <div id="panelsStayOpen-collapseOne" class="accordion-collapse collapse"
            aria-labelledby="panelsStayOpen-headingOne" data-bs-parent="#accordionPanelsStayOpenExample">
            <div class="accordion-body">
      <app-card [hidHeader]="true" class="list-panel add-panel">
        <div class="row">
          <!-- Aadhar Number -->
          <div class="col-lg-3 col-md-3 col-sm-6 col-12">
            <div class="form-group">
              <label>Vehicle Number </label>
              <input type="text" formControlName="vehicleNumber" class="form-control"
                placeholder="Enter Vehicle Number" />
            </div>
          </div>

          <!-- Aadhar Number -->
          <div class="col-lg-3 col-md-3 col-sm-6 col-12">
            <div class="form-group">
              <label>Vehicle Name</label>
              <input type="text" formControlName="vehicleName" class="form-control" placeholder="Enter Vehicle Name" />
            </div>
          </div>
        </div>

        <!-- Submit and Cancel buttons -->
        <div class="row mt-3">
          <div class="col-lg-12 text-end">
            <div class="modal-footer">
              <button type="submit" class="btn btn-outline-info list-button-container" (click)="search()"><span
                  class="list-text-alaign-center">Submit</span></button>
              <button type="button" class="btn btn-outline-secondary list-button-container" (click)="onclear()"><span
                  class="list-text-alaign-center">Clear</span></button>

            </div>
          </div>
        </div>

      </app-card>
      </div>
      </div>
      </div>
      </div>
      <br>
    </form>
  </div>
</div>


<div class="row">
  <div class="outer-container">
    <div class="button-container">
      <button class="btn btn-outline-success list-button-container" [routerLink]="'/master/vehicle-detail/add'">
        <span class="list-text-alaign-center">Add</span>
      </button>
      <button class="btn btn-outline-secondary list-button-container" [disabled]="!editDisabled" (click)="edit()">
        <span class="list-text-alaign-center">Edit</span>
      </button>
      <button class="btn btn-outline-warning list-button-container" [disabled]="!viewDisabled" (click)="view()">
        <span class="list-text-alaign-center">View</span>
      </button>
    </div>
  </div>

  <app-mat-table-configuration [columns]="columns" [actionKeys]="actionKeys" [dataSource]="dataSource"
    [totalCount]="totelCount" [pageSize]="pageSize" (paginationEvent)="handlePagination($event)"
    (checkboxAction)="onChecked($event)">
  </app-mat-table-configuration>

  <div class="row">
    <div class="col-xl-4 mt-2">
      <div class="dropdown">
        <button class="btn btn-outline-primary dropdown-toggle" type="button" data-bs-toggle="dropdown"
          aria-expanded="false">
          Download
        </button>
        <ul class="dropdown-menu">
          <li><a class="dropdown-item" href="javascript:void(0)" (click)="exportToExcel()">Excel</a></li>
          <li><a class="dropdown-item" href="javascript:void(0)" (click)="generatePDF()">PDF</a></li>
