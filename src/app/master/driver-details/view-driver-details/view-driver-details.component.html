<ul class="breadcrumb">
  <li class="breadcrumb-item">
    <a [routerLink]="['/dashboard']">Home</a>
  </li>
  <ng-container>
    <li class="breadcrumb-item" [routerLink]="['/master/driver-detail/list']"><a href="javascript:">Driver Details</a>
    </li>
    <li class="breadcrumb-item"><a href="javascript:">View</a></li>
  </ng-container>
</ul>


<app-card [hidHeader]="true" class="view-panel">
  <div class="row">
    <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
      <div class="row">
        <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 col-6">
          <label class="w-100 view-label">Indent Date</label>
          <span>--</span>
        </div>

        <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 col-6">
          <label class="w-100 view-label">Indent No</label>
          <span> --</span>
        </div>

        <div class="col-xl-6 col-lg-6 col-md-6 col-sm-6 col-6">
          <label class="w-100 view-label">Status</label>
          <span>--</span>
        </div>
      </div>
    </div>
  </div>

  <div class="row mt-3">
    <div class="col-lg-12 text-end">
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary"
          [routerLink]="['/master/driver-detail/list']">Back</button>

      </div>
    </div>
  </div>
</app-card>
