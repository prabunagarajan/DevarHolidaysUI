<h3>Add Trip Details</h3>
<ul class="breadcrumb">
    <li class="breadcrumb-item">
        <a [routerLink]="['/dashboard']">Home</a>
    </li>
    <ng-container>
        <li class="breadcrumb-item" [routerLink]="['/ayyanar-transport/trip-detail-at/list']"><a href="javascript:">
                Trip
                Details</a>
        </li>
        <li class="breadcrumb-item"><a href="javascript:">{{screenName}}</a></li>
    </ng-container>
</ul>

<div class="row">
    <div class="col-xl-12">
        <form [formGroup]="tripFormDetailsAT" autocomplete="off">
            <app-card [hidHeader]="true" class="list-panel add-panel">
                <h3>Customer & Vehicel Details</h3>
                <hr>
                <div class="row">
                    <div class="col-lg-3 col-md-3 col-sm-6 col-12">
                        <div class="form-group">
                            <label>Trip No<span class="text-danger">*</span></label>
                            <input type="text" class="form-control" placeholder="Enter Trip No">
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-3 col-sm-6 col-12">
                        <div class="form-group">
                            <label>Date<span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input type="text" [owlDateTime]="dt1" class="form-control" placeholder="Select Date"
                                    readonly [max]="maxDate" (keypress)="$event.preventDefault();"
                                    (keydown)="$event.preventDefault()">
                                <div class="input-group-append">
                                    <button class="btn btn-outline-secondary" [owlDateTimeTrigger]="dt1" type="button">
                                        📅
                                    </button>
                                </div>
                                <owl-date-time [pickerType]="'calendar'" #dt1></owl-date-time>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-3 col-sm-6 col-12">
                        <div class="form-group">
                            <label>Opening KM<span class="text-danger">*</span></label>
                            <input type="text" class="form-control" placeholder="Enter Opening KM">
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-3 col-sm-6 col-12">
                        <div class="form-group">
                            <label>Closing KM<span class="text-danger">*</span></label>
                            <input type="text" class="form-control" placeholder="Enter Closing KM">
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-3 col-sm-6 col-12">
                        <div class="form-group">
                            <label>Total Running KM<span class="text-danger">*</span></label>
                            <input type="text" class="form-control" placeholder="Enter Total Running KM">
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-3 col-sm-6 col-12">
                        <div class="form-group">
                            <label>Driver Name<span class="text-danger">*</span></label>
                            <input type="text" class="form-control" placeholder="Enter Driver Name">
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-3 col-sm-6 col-12">
                        <div class="form-group">
                            <label>Transport Booking<span class="text-danger">*</span></label>
                            <input type="text" class="form-control" placeholder="Enter Transport Booking">
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-3 col-sm-6 col-12">
                        <div class="form-group">
                            <label>Transport<span class="text-danger">*</span></label>
                            <input type="text" class="form-control" placeholder="Enter Transport">
                        </div>
                    </div>
                </div>
            </app-card>
            <app-card [hidHeader]="true" class="list-panel add-panel">
                <h3>Consignor Details</h3>
                <hr>
                <div class="row">
                    <div class="col-lg-12 col-md-12 col-sm-12 col-12">
                        <div class="form-group">
                            <label>Consignor<span class="text-danger">*</span></label>
                            <input type="text" class="form-control" placeholder="Enter Consignor">
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-3 col-sm-6 col-12">
                        <div class="form-group">
                            <label>Driver Salery 15%<span class="text-danger">*</span></label>
                            <input type="text" class="form-control" placeholder="Enter Driver Salery 15%">
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-3 col-sm-6 col-12">
                        <div class="form-group">
                            <label>Diesal<span class="text-danger">*</span></label>
                            <input type="text" class="form-control" placeholder="Enter Diesal">
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-3 col-sm-6 col-12">
                        <div class="form-group">
                            <label>RTO Check Post<span class="text-danger">*</span></label>
                            <input type="text" class="form-control" placeholder="Enter RTO Check Post">
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-3 col-sm-6 col-12">
                        <div class="form-group">
                            <label>Toll Plaza<span class="text-danger">*</span></label>
                            <input type="text" class="form-control" placeholder="Enter Toll Plaza">
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-3 col-sm-6 col-12">
                        <div class="form-group">
                            <label>Commission<span class="text-danger">*</span></label>
                            <input type="text" class="form-control" placeholder="Enter Commission">
                        </div>
                    </div>
                </div>
            </app-card>
            <app-card [hidHeader]="true" class="list-panel add-panel">
                <h3>Consignee Details</h3>
                <hr>
                <div class="row">
                    <div class="col-lg-12 col-md-12 col-sm-12 col-12">
                        <div class="form-group">
                            <label>Consignee<span class="text-danger">*</span></label>
                            <input type="text" class="form-control" placeholder="Enter Consignee">
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-3 col-sm-6 col-12">
                        <div class="form-group">
                            <label>Loading / Unloading<span class="text-danger">*</span></label>
                            <input type="text" class="form-control" placeholder="Enter Loading / Unloading">
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-3 col-sm-6 col-12">
                        <div class="form-group">
                            <label>Add Blue Oil<span class="text-danger">*</span></label>
                            <input type="text" class="form-control" placeholder="Enter Add Blue Oil">
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-3 col-sm-6 col-12">
                        <div class="form-group">
                            <label>Expens 1<span class="text-danger">*</span></label>
                            <input type="text" class="form-control" placeholder="Enter Expens 1">
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-3 col-sm-6 col-12">
                        <div class="form-group">
                            <label>Expens 2<span class="text-danger">*</span></label>
                            <input type="text" class="form-control" placeholder="Enter Expens 2">
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-3 col-sm-6 col-12">
                        <div class="form-group">
                            <label>Total Expenses<span class="text-danger">*</span></label>
                            <input type="text" class="form-control" placeholder="Enter Total Expenses">
                        </div>
                    </div>
                </div>
            </app-card>

            <app-card [hidHeader]="true" class="list-panel add-panel">
                <div class="row">
                    <div class="col-lg-3 col-md-3 col-sm-6 col-12">
                        <div class="form-group">
                            <label>Advance 1<span class="text-danger">*</span></label>
                            <input type="text" class="form-control" placeholder="Enter Advance 1">
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-3 col-sm-6 col-12">
                        <div class="form-group">
                            <label>Advance 2<span class="text-danger">*</span></label>
                            <input type="text" class="form-control" placeholder="Enter Advance 2">
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-3 col-sm-6 col-12">
                        <div class="form-group">
                            <label>Balance<span class="text-danger">*</span></label>
                            <input type="text" class="form-control" placeholder="Enter Balance">
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-3 col-sm-6 col-12">
                        <div class="form-group">
                            <label>Balance Recd Date<span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input type="text" [owlDateTime]="dt2" class="form-control"
                                    placeholder="Select Balance Recd Date" readonly [max]="maxDate"
                                    (keypress)="$event.preventDefault();" (keydown)="$event.preventDefault()">
                                <div class="input-group-append">
                                    <button class="btn btn-outline-secondary" [owlDateTimeTrigger]="dt2" type="button">
                                        📅
                                    </button>
                                </div>
                                <owl-date-time [pickerType]="'calendar'" #dt2></owl-date-time>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-3 col-sm-6 col-12">
                        <div class="form-group">
                            <label>Freight Amount<span class="text-danger">*</span></label>
                            <input type="text" class="form-control" placeholder="Enter Freight Amount">
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-3 col-sm-6 col-12">
                        <div class="form-group">
                            <label>Less Expenses<span class="text-danger">*</span></label>
                            <input type="text" class="form-control" placeholder="Enter Less Expenses">
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-3 col-sm-6 col-12">
                        <div class="form-group">
                            <label>Profit Or Loss<span class="text-danger">*</span></label>
                            <input type="text" class="form-control" placeholder="Enter Profit Or Loss">
                        </div>
                    </div>
                </div>
            </app-card>
        </form>
    </div>
</div>
