module.exports = "<div class=\"outer-container\">\n    <div class=\"button-container\">\n        <button class=\"btn btn-outline-secondary list-button-container\" (click)=\"onEdit()\" [disabled]=\"!editEnable\">\n            <span class=\"list-text-alaign-center\">Edit</span>\n        </button>\n        <button class=\"btn btn-outline-warning list-button-container\" (click)=\"onView()\" [disabled]=\"!viewEnable\">\n            <span class=\"list-text-alaign-center\">View</span>\n        </button>\n    </div>\n</div>\n\n<!-- <app-card [hidHeader]=\"true\" blockClass=\"table-border-style\" class=\"list-panel\">\n    <div class=\"table-responsive text-center\">\n        <div class=\"example-table-container\">\n            <table mat-table [dataSource]=\"dataSource\" class=\"table-design\">\n                <ng-container matColumnDef=\"serialNo\">\n                    <th mat-header-cell *matHeaderCellDef class=\"text-center\"> S.No </th>\n                    <td mat-cell *matCellDef=\"let element; let i = index\" class=\"text-center\"> {{ i + 1 }} </td>\n                </ng-container>\n\n                <ng-container matColumnDef=\"tripNumber\">\n                    <th mat-header-cell *matHeaderCellDef class=\"text-center\">Trip Number</th>\n                    <td mat-cell *matCellDef=\"let element\" class=\"text-center\"> {{element.tripNumber}} </td>\n                </ng-container>\n\n                <ng-container matColumnDef=\"createdDate\">\n                    <th mat-header-cell *matHeaderCellDef class=\"text-center\"> Date </th>\n                    <td mat-cell *matCellDef=\"let element\" class=\"text-center\">\n                        {{element.createdDate | date: 'dd-MM-yyyy'}}\n                    </td>\n                </ng-container>\n\n                <ng-container matColumnDef=\"vehicleNumber\">\n                    <th mat-header-cell *matHeaderCellDef class=\"text-center\"> Vehicle Number </th>\n                    <td mat-cell *matCellDef=\"let element\" class=\"text-center\"> {{element.vehicleNumber}} </td>\n                </ng-container>\n\n                <ng-container matColumnDef=\"customerName\">\n                    <th mat-header-cell *matHeaderCellDef class=\"text-center\">Customer Name</th>\n                    <td mat-cell *matCellDef=\"let element\" class=\"text-center\"> {{element.customerName}} </td>\n                </ng-container>\n\n                <ng-container matColumnDef=\"visitingPlace\">\n                    <th mat-header-cell *matHeaderCellDef class=\"text-center\"> Visiting Place </th>\n                    <td mat-cell *matCellDef=\"let element\" class=\"text-center\"> {{element.visitingPlace}} </td>\n                </ng-container>\n\n                <ng-container matColumnDef=\"driverName\">\n                    <th mat-header-cell *matHeaderCellDef class=\"text-center\"> Driver Name </th>\n                    <td mat-cell *matCellDef=\"let element\" class=\"text-center\"> {{element.driverName}} </td>\n                </ng-container>\n\n                <ng-container matColumnDef=\"totalRent\">\n                    <th mat-header-cell *matHeaderCellDef class=\"text-center\">Total Rent</th>\n                    <td mat-cell *matCellDef=\"let element\" class=\"text-center\"> {{element.totalRent}} </td>\n                </ng-container>\n\n\n                <ng-container matColumnDef=\"pendingAmount\">\n                    <th mat-header-cell *matHeaderCellDef class=\"text-center\">Pending Amount</th>\n                    <td mat-cell *matCellDef=\"let element\" class=\"text-center\"> {{element.pendingAmount}} </td>\n                </ng-container>\n\n                <ng-container matColumnDef=\"status\">\n                    <th mat-header-cell *matHeaderCellDef class=\"text-center\"> Status </th>\n                    <td mat-cell *matCellDef=\"let element\" class=\"text-center\">\n                        <span class=\"badge badge-light-success\"\n                            *ngIf=\"element?.status == 'APPROVED'\">{{element?.status}}</span>\n                        <span class=\"badge badge-light-info\"\n                            *ngIf=\"element?.status == 'INPROGRESS'\">{{element?.status}}</span>\n                        <span class=\"badge badge-light-secondary\"\n                            *ngIf=\"element?.status == 'FORWARDED'\">{{element?.status}}</span>\n                        <span class=\"badge badge-light-warning\"\n                            *ngIf=\"element?.status == 'REQUESTFORCLARIFICATION'\">{{element?.status}}</span>\n                    </td>\n                </ng-container>\n\n                <ng-container matColumnDef=\"action\">\n                    <th mat-header-cell *matHeaderCellDef class=\"text-center\"> Action </th>\n                    <td mat-cell *matCellDef=\"let element\" class=\"text-center\">\n                        <mat-radio-button (click)=\"onSelect(element)\"></mat-radio-button>\n                    </td>\n                </ng-container>\n\n                <tr mat-header-row *matHeaderRowDef=\"displayedColumns\"></tr>\n                <tr mat-row *matRowDef=\"let row; columns: displayedColumns;\"></tr>\n            </table>\n            <div *ngIf=\"isLoading\" class=\"table-loader\">\n                <mat-spinner diameter=\"64\"></mat-spinner>\n            </div>\n            <mat-paginator [length]=\"totelCount\" [pageSize]=\"pageSize\" [pageSizeOptions]=\"[10, 25, 50, 100]\"\n                (page)=\"pageEvent($event)\">\n            </mat-paginator>\n        </div>\n    </div>\n</app-card> -->\n\n\n<app-mat-table-configuration [columns]=\"columns\" [actionKeys]=\"actionKeys\" [dataSource]=\"dataSource\"\n    [totalCount]=\"totelCount\" [pageSize]=\"pageSize\" (paginationEvent)=\"handlePagination($event)\"\n    (checkboxAction)=\"onChecked($event)\">\n</app-mat-table-configuration>"
