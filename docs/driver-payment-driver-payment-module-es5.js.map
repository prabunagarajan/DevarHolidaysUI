module.exports = "<div class=\"row\">\r\n    <div class=\"col-xl-12\">\r\n        <form [formGroup]=\"driverPaymentFormSearchDetails\" autocomplete=\"off\">\r\n            <app-card [hidHeader]=\"true\" class=\"view-panel\">\r\n                <h4>Search</h4>\r\n                <div class=\"row\">\r\n                    <div class=\"col-lg-3 col-md-3 col-sm-6 col-12\">\r\n                        <div class=\"form-group\">\r\n                            <label>Driver Name<span class=\"text-danger\">*</span></label>\r\n                            <select type=\"text\" class=\"form-select\" formControlName=\"driverNames\"\r\n                                placeholder=\"Enter Driver Name\">\r\n                                <option value=\"\" selected disabled>Select Driver Name</option>\r\n                                <option *ngFor=\"let driverListElemnt of driverList\" value=\"{{driverListElemnt?.name}}\">\r\n                                    {{driverListElemnt?.name}}</option>\r\n                            </select>\r\n                        </div>\r\n                    </div>\r\n                    <div class=\"col-lg-3 col-md-3 col-sm-6 col-12\">\r\n                        <div class=\"form-group\">\r\n                            <label for=\"driverNumber\">Driver Number</label>\r\n                            <select type=\"text\" class=\"form-select\" formControlName=\"driverNumber\"\r\n                                placeholder=\"Enter Driver Name\">\r\n                                <option value=\"\" selected disabled>Select Driver Name</option>\r\n                                <option *ngFor=\"let driverListElemnt of driverList\"\r\n                                    value=\"{{driverListElemnt?.mobileNumber}}\">\r\n                                    {{driverListElemnt?.mobileNumber}}</option>\r\n                            </select>\r\n                        </div>\r\n                    </div>\r\n                </div>\r\n\r\n                <div class=\"row mt-3\">\r\n                    <div class=\"col-lg-12 text-end\">\r\n                        <div class=\"modal-footer\">\r\n                            <button type=\"submit\" class=\"btn btn-outline-info list-button-container\"\r\n                                (click)=\"search()\"><span class=\"list-text-alaign-center\">Submit</span></button>\r\n                            <button type=\"button\" class=\"btn btn-outline-secondary list-button-container\"\r\n                                (click)=\"onclear()\"><span class=\"list-text-alaign-center\">Clear</span></button>\r\n\r\n                        </div>\r\n                    </div>\r\n                </div>\r\n            </app-card>\r\n        </form>\r\n    </div>\r\n</div>\r\n\r\n<div class=\"outer-container\">\r\n    <div class=\"button-container\">\r\n        <button class=\"btn btn-outline-success list-button-container\" [routerLink]=\"['/container/driver-payment/add']\">\r\n            <span class=\"list-text-alaign-center\">Add</span>\r\n        </button>\r\n        <!-- <button class=\"btn btn-outline-secondary list-button-container\" (click)=\"onEdit()\" [disabled]=\"!editEnable\">\r\n            <span class=\"list-text-alaign-center\">Edit</span>\r\n        </button> -->\r\n        <button class=\"btn btn-outline-warning list-button-container\" (click)=\"onView()\" [disabled]=\"!viewEnable\">\r\n            <span class=\"list-text-alaign-center\">View</span>\r\n        </button>\r\n    </div>\r\n</div>\r\n\r\n\r\n<!-- <app-card [hidHeader]=\"true\" blockClass=\"table-border-style\" class=\"list-panel\">\r\n    <div class=\"table-responsive text-center\">\r\n        <div class=\"example-table-container\">\r\n            <table mat-table [dataSource]=\"dataSource\" class=\"table-design\">\r\n                <ng-container matColumnDef=\"serialNo\">\r\n                    <th mat-header-cell *matHeaderCellDef class=\"text-center\"> S.No </th>\r\n                    <td mat-cell *matCellDef=\"let element; let i = index\" class=\"text-center\"> {{ i + 1 }} </td>\r\n                </ng-container>\r\n                <ng-container matColumnDef=\"paymentDate\">\r\n                    <th mat-header-cell *matHeaderCellDef class=\"text-center\"> Payment Date </th>\r\n                    <td mat-cell *matCellDef=\"let element\" class=\"text-center\"> {{element?.paymentDate | date:\r\n                        'dd-MM-yyyy hh-mm'}} </td>\r\n                </ng-container>\r\n                <ng-container matColumnDef=\"driverName\">\r\n                    <th mat-header-cell *matHeaderCellDef class=\"text-center\"> Driver Name </th>\r\n                    <td mat-cell *matCellDef=\"let element\" class=\"text-center\">\r\n                        {{element?.driverName}}\r\n                    </td>\r\n                </ng-container>\r\n                <ng-container matColumnDef=\"paymentNo\">\r\n                    <th mat-header-cell *matHeaderCellDef class=\"text-center\">Payment No </th>\r\n                    <td mat-cell *matCellDef=\"let element\" class=\"text-center\"> {{element?.paymentNo}} </td>\r\n                </ng-container>\r\n                <ng-container matColumnDef=\"salaryType\">\r\n                    <th mat-header-cell *matHeaderCellDef class=\"text-center\">Salary Type</th>\r\n                    <td mat-cell *matCellDef=\"let element\" class=\"text-center\">\r\n                        <span class=\"badge badge-light-danger\"\r\n                            *ngIf=\"element?.salaryType == 'ADVANCE'\">{{element?.salaryType}}</span>\r\n                        <span class=\"badge badge-light-primary\"\r\n                            *ngIf=\"element?.salaryType == 'WAGES'\">{{element?.salaryType}}</span>\r\n                    </td>\r\n                </ng-container>\r\n                <ng-container matColumnDef=\"monthlySalary\">\r\n                    <th mat-header-cell *matHeaderCellDef class=\"text-center\"> Monthly Salary </th>\r\n                    <td mat-cell *matCellDef=\"let element\" class=\"text-center\"> {{element?.monthlySalary}} </td>\r\n                </ng-container>\r\n                <ng-container matColumnDef=\"driverNamess\">\r\n                    <th mat-header-cell *matHeaderCellDef class=\"text-center\"> Driver Name </th>\r\n                    <td mat-cell *matCellDef=\"let element\" class=\"text-center\"> {{element?.driverName}} </td>\r\n                </ng-container>\r\n                <ng-container matColumnDef=\"dailyWagesOrAdvance\">\r\n                    <th mat-header-cell *matHeaderCellDef class=\"text-center\">Wages Or Advance</th>\r\n                    <td mat-cell *matCellDef=\"let element\" class=\"text-center\"> {{element?.dailyWagesOrAdvance}} </td>\r\n                </ng-container>\r\n                <ng-container matColumnDef=\"remarks\">\r\n                    <th mat-header-cell *matHeaderCellDef class=\"text-center\"> Remark </th>\r\n                    <td mat-cell *matCellDef=\"let element\" class=\"text-center\"> {{element?.remarks}} </td>\r\n                </ng-container>\r\n                <ng-container matColumnDef=\"action\">\r\n                    <th mat-header-cell *matHeaderCellDef class=\"text-center\"> Action </th>\r\n                    <td mat-cell *matCellDef=\"let element\" class=\"text-center\">\r\n                        <mat-radio-button (click)=\"onSelect(element)\"></mat-radio-button>\r\n                    </td>\r\n                </ng-container>\r\n\r\n                <tr mat-header-row *matHeaderRowDef=\"displayedColumns\"></tr>\r\n                <tr mat-row *matRowDef=\"let row; columns: displayedColumns;\"></tr>\r\n            </table>\r\n            <div *ngIf=\"isLoading\" class=\"table-loader\">\r\n                <mat-spinner diameter=\"64\"></mat-spinner>\r\n            </div>\r\n            <mat-paginator [length]=\"totelCount\" [pageSize]=\"pageSize\" [pageSizeOptions]=\"[10, 25, 50, 100]\"\r\n                (page)=\"pageEvent($event)\">\r\n            </mat-paginator>\r\n        </div>\r\n    </div>\r\n</app-card> -->\r\n\r\n<app-mat-table-configuration [columns]=\"columns\" [actionKeys]=\"actionKeys\" [dataSource]=\"dataSource\"\r\n    [totalCount]=\"totelCount\" [pageSize]=\"pageSize\" (paginationEvent)=\"handlePagination($event)\"\r\n    (checkboxAction)=\"onChecked($event)\">\r\n</app-mat-table-configuration>"
